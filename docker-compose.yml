version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: always
    depends_on:
      - postgres
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+asyncpg://crm_user:strongpassword@postgres:5432/crm
      JWT_SECRET: ChangeMeToSecretKey
volumes:
  pgdata:
